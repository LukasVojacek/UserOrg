<script>
(() => {
  const DATA = JSON.parse(document.getElementById('flow-data').textContent);
  const N = DATA.nodes || {};
  const EPS = DATA.endpoints || [];
  const GAPS = DATA.gaps || [];
  const KIND = { handler:'handler', service:'service', repo:'repository (DB)', client:'external service client', external:'external system' };
  // Static estimates in ms by node kind; a node's own "ms" overrides them. Not measurements.
  const EST_MS = { handler:1, service:1, repo:10, client:1, external:200 };
  const IO = new Set(['repo', 'client', 'external']);
  const LOOPED = new Set(['repo', 'client']);
  const edges = id => (N[id]?.calls || []).map(c => typeof c === 'string' ? { to: c } : c);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const ownMs = id => Number(N[id]?.ms ?? EST_MS[N[id]?.kind] ?? 0) || 0;

  // Walk the call tree, guarded against cycles, with the loop multiplier
  function walk(id, edge, path, mult, visit) {
    visit(id, edge, path, mult);
    if (path.includes(id)) return;
    for (const e of edges(id)) walk(e.to, e, [...path, id], mult * (e.loop || 1), visit);
  }

  function cost(id, path = []) {
    if (path.includes(id)) return 0;
    let t = ownMs(id);
    for (const e of edges(id)) t += cost(e.to, [...path, id]) * (e.loop || 1);
    return t;
  }

  // Where each node is used
  const usedIn = {}, callers = {};
  EPS.forEach((ep, i) => walk(ep.handler, null, [], 1, (id, edge, path) => {
    (usedIn[id] ??= new Set()).add(i);
    if (path.length) (callers[id] ??= new Set()).add(path[path.length - 1]);
  }));

  // Rules for problem spots, one function per rule
  function noteLoop(loops, id, mult, path) {
    if (mult > 1 && LOOPED.has(N[id]?.kind) && !loops[id]) loops[id] = { mult, via: path[path.length - 1] };
  }
  function seqCalls(id) {
    const kids = edges(id).filter(e => N[e.to]?.kind === 'client' && !e.dependsOnPrevious).map(e => e.to);
    if (kids.length < 2) return [];
    return [{ rule:'Sequential external calls', nodes: kids,
      text: `${id} calls ${kids.join(' and ')} one after another. If they do not depend on each other, they can run in parallel.` }];
  }
  function missingTimeout(id) {
    if (N[id]?.kind !== 'client' || N[id].timeoutMs != null) return [];
    return [{ rule:'Missing timeout', nodes:[id],
      text: `${id} has no timeout set. A slow external service blocks the whole request.` }];
  }
  function duplicates(counts) {
    return Object.entries(counts).filter(([id, c]) => c > 1 && IO.has(N[id]?.kind)).map(([id, c]) => ({
      rule:'Duplicate call', nodes:[id], text: `${id} is called ${c}× in one request.` }));
  }
  function nPlusOne(loops) {
    return Object.entries(loops).map(([id, l]) => ({
      rule:'N+1', nodes:[id], text: `${id} runs in a loop (≈${l.mult}×) from ${l.via}.` }));
  }
  function findings(ep) {
    const out = [], counts = {}, loops = {}, seen = new Set();
    walk(ep.handler, null, [], 1, (id, edge, path, mult) => {
      counts[id] = (counts[id] || 0) + 1;
      noteLoop(loops, id, mult, path);
      if (seen.has(id)) return;
      seen.add(id);
      out.push(...seqCalls(id), ...missingTimeout(id));
    });
    return out.concat(duplicates(counts), nPlusOne(loops));
  }

  function renderMeta() {
    document.getElementById('meta').innerHTML = `${esc(DATA.solution ?? '')} · ${esc(DATA.generated ?? '')}`;
  }
  function renderGaps() {
    const box = document.getElementById('gaps');
    box.hidden = !GAPS.length;
    box.innerHTML = GAPS.length ? `<h2>Gaps (${GAPS.length})</h2><ul>${GAPS.map(g =>
      `<li><span class="mono">${esc(g.where ?? '')}</span> ${esc(g.what ?? '')}</li>`).join('')}</ul>` : '';
  }
  function renderEmpty() {
    document.getElementById('main').innerHTML = '<p class="none">No endpoints found.</p>';
  }

  if (!EPS.length) { renderMeta(); renderEmpty(); renderGaps(); return; }

  const FINDINGS = EPS.map(findings);
  const TOTAL = EPS.map(ep => cost(ep.handler));
  let current = 0, selected = null, view = 'diagram', expanded = new Set([EPS[0].handler]), hlIds = [];

  // Endpoint list + search (also by a method used)
  const list = document.getElementById('eplist');
  const search = document.getElementById('search');
  function renderList() {
    const q = search.value.trim().toLowerCase();
    list.innerHTML = '';
    EPS.forEach((ep, i) => {
      const pathHit = !q || (ep.method + " " + ep.path).toLowerCase().includes(q);
      const via = q && !pathHit ? Object.keys(usedIn).find(id => id.toLowerCase().includes(q) && usedIn[id].has(i)) : null;
      if (!pathHit && !via) return;
      const f = FINDINGS[i].length;
      const li = document.createElement('li');
      li.innerHTML = `<button aria-current="${i === current}">
        <div class="ep-path mono"><span class="method">${esc(ep.method)}</span>${esc(ep.path)}</div>
        <div class="ep-meta">≈ ${TOTAL[i]} ms${f ? ` <span class="bad">${f} ${f === 1 ? 'problem' : 'problems'}</span>` : ''}</div>
        ${via ? `<div class="via mono">via ${esc(via)}</div>` : ''}
      </button>`;
      li.firstElementChild.onclick = () => { current = i; selected = null; resetView(); renderList(); renderMain(); renderDetail(); };
      list.appendChild(li);
    });
    if (!list.children.length) list.innerHTML = '<li class="none">Nothing matches the search.</li>';
  }
  search.oninput = renderList;

  // Call tree
  function buildRow(id, edge, path, mult, order, flagged) {
    const n = N[id] || { kind:'service' };
    const li = document.createElement('li');
    li.className = 'row';
    li.dataset.node = id;
    const isCycle = path.includes(id);
    const kids = isCycle ? [] : edges(id);
    const shared = usedIn[id]?.size > 1;
    const tags = [];
    if (edge?.input) tags.push(`<span class="tag input">← ${esc(edge.input)}</span>`);
    if (edge?.loop) tags.push(`<span class="tag loop">loop ×${esc(edge.loop)}</span>`);
    if (shared) tags.push(`<span class="tag shared">shared in ${usedIn[id].size} endpoints</span>`);
    if (flagged.has(id)) tags.push(`<span class="tag warn">⚠ problem</span>`);
    const c = cost(id, path) * mult;
    tags.push(`<span class="tag">≈ ${c} ms</span>`);
    li.innerHTML = `<div class="line">
      ${kids.length ? `<button class="tog" aria-expanded="false" aria-label="Expand ${esc(id)}">▸</button>` : '<span class="spacer"></span>'}
      ${order ? `<span class="ord mono">${order}.</span>` : ''}
      <button class="name mono k-${esc(n.kind)}${selected === id ? ' sel' : ''}">${esc(id)}</button>
      ${tags.join('')}
      ${isCycle ? '<span class="cycle">cycle</span>' : ''}
    </div>`;
    li.querySelector('.name').onclick = () => { selected = id; renderDetail(); document.querySelectorAll('.name.sel').forEach(b => b.classList.remove('sel')); document.querySelectorAll(`.row[data-node="${CSS.escape(id)}"] > .line .name`).forEach(b => b.classList.add('sel')); };
    if (kids.length) {
      const ul = document.createElement('ul');
      ul.hidden = true;
      kids.forEach((e, k) => ul.appendChild(buildRow(e.to, e, [...path, id], mult * (e.loop || 1), kids.length > 1 ? k + 1 : 0, flagged)));
      li.appendChild(ul);
      const tog = li.querySelector('.tog');
      tog.onclick = () => setOpen(li, ul.hidden);
    }
    return li;
  }
  function setOpen(li, open) {
    const ul = li.querySelector(':scope > ul'), tog = li.querySelector(':scope > .line > .tog');
    if (!ul) return;
    ul.hidden = !open;
    tog.setAttribute('aria-expanded', open);
  }
  function resetView() { expanded = new Set([EPS[current].handler]); hlIds = []; }
  const motion = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

  function setAll(open) {
    if (view === 'diagram') {
      const root = EPS[current].handler;
      expanded = new Set([root]);
      if (open) walk(root, null, [], 1, id => expanded.add(id));
      renderView();
      return;
    }
    document.querySelectorAll('#tree .row').forEach(li => setOpen(li, open));
    if (!open) setOpen(document.querySelector('#tree > .row'), true);
  }

  function reaches(from, target, path = []) {
    if (from === target) return true;
    if (path.includes(from)) return false;
    return edges(from).some(e => reaches(e.to, target, [...path, from]));
  }

  function highlight(ids) {
    hlIds = ids;
    if (view === 'diagram') {
      walk(EPS[current].handler, null, [], 1, id => { if (ids.some(t => t !== id && reaches(id, t))) expanded.add(id); });
      renderView();
      document.querySelector('#view .node.hl')?.scrollIntoView({ block:'center', inline:'center', behavior: motion() });
      return;
    }
    document.querySelectorAll('.row.hl').forEach(r => r.classList.remove('hl'));
    let first = null;
    document.querySelectorAll('#tree .row').forEach(r => {
      if (!ids.includes(r.dataset.node)) return;
      r.classList.add('hl');
      first ??= r;
      for (let p = r.parentElement.closest('.row'); p; p = p.parentElement.closest('.row')) setOpen(p, true);
    });
    first?.scrollIntoView({ block:'center', behavior: motion() });
  }

  // Diagram: a shared node appears once in the graph, click to expand
  const W = 268, H = 54, GX = 100, GY = 20, PAD = 24;
  function visibleGraph(root) {
    const nodes = [root], seen = new Set([root]), E = [];
    (function dfs(id, path) {
      if (!expanded.has(id)) return;
      const es = edges(id);
      es.forEach((e, k) => {
        if (e.to === id || path.includes(e.to)) return;
        E.push({ from: id, to: e.to, e, ord: es.length > 1 ? k + 1 : 0 });
        if (!seen.has(e.to)) { seen.add(e.to); nodes.push(e.to); dfs(e.to, [...path, id]); }
      });
    })(root, []);
    return { nodes, E };
  }

  function layout(nodes, E) {
    const L = Object.fromEntries(nodes.map(n => [n, 0]));
    for (let i = 0; i < nodes.length; i++) {
      let changed = false;
      for (const x of E) if (L[x.to] < L[x.from] + 1) { L[x.to] = L[x.from] + 1; changed = true; }
      if (!changed) break;
    }
    const layers = [];
    nodes.forEach(n => (layers[L[n]] ??= []).push(n));
    const pos = {};
    layers.forEach((ly, li) => {
      const want = n => {
        const ys = E.filter(x => x.to === n && pos[x.from]).map(x => pos[x.from].y);
        return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : PAD;
      };
      if (li > 0) ly.sort((a, b) => want(a) - want(b));
      let prev = PAD - H - GY;
      ly.forEach(n => {
        const y = li ? Math.max(want(n), prev + H + GY) : PAD;
        prev = y;
        pos[n] = { x: PAD + li * (W + GX), y };
      });
    });
    return { pos, cols: layers.length };
  }

  function renderDiagram(root) {
    const { nodes, E } = visibleGraph(root);
    const { pos, cols } = layout(nodes, E);
    const flagged = new Set(FINDINGS[current].flatMap(f => f.nodes));
    const width = PAD * 2 + cols * (W + GX) - GX + 12;
    const height = Math.max(...nodes.map(n => pos[n].y)) + H + PAD;

    const edgeSvg = E.map(x => {
      const a = pos[x.from], b = pos[x.to];
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      const cls = ['edge', x.e.loop ? 'loop' : '', N[x.to]?.kind === 'external' ? 'ext' : ''].join(' ');
      const label = [x.ord ? x.ord + '.' : '', x.e.input ? '← ' + x.e.input : '', x.e.loop ? 'loop ×' + x.e.loop : ''].filter(Boolean).join('  ');
      return `<path class="${cls}" marker-end="url(#arr)" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}"/>`
        + (label ? `<text class="elabel${x.e.loop ? ' loop' : ''}" x="${mx}" y="${(y1 + y2) / 2 - 5}" text-anchor="middle">${esc(label)}</text>` : '');
    }).join('');

    const nodeSvg = nodes.map(id => {
      const n = N[id] || { kind: 'service' }, p = pos[id];
      const kids = edges(id).length, open = expanded.has(id);
      const label = id.length > 34 ? id.slice(0, 33) + '…' : id;
      const meta = [`<tspan>≈ ${cost(id)} ms</tspan>`];
      if (usedIn[id]?.size > 1) meta.push(`<tspan dx="12" class="sh">shared in ${usedIn[id].size}</tspan>`);
      if (flagged.has(id)) meta.push(`<tspan dx="12" class="wr">⚠ problem</tspan>`);
      if (kids && !open) meta.push(`<tspan dx="12">${kids} ${kids === 1 ? 'call' : 'calls'} hidden</tspan>`);
      const cls = ['node', 'k-' + esc(n.kind), hlIds.includes(id) ? 'hl' : '', selected === id ? 'sel' : ''].join(' ');
      return `<g class="${cls}" data-id="${esc(id)}" tabindex="0" role="button" aria-label="${esc(id)}${kids ? (open ? ', collapse' : ', expand') : ''}" transform="translate(${p.x},${p.y})">
        <title>${esc(id)}</title>
        <rect width="${W}" height="${H}" rx="6"/>
        <text class="nl" x="12" y="22">${esc(label)}</text>
        <text class="nm" x="12" y="41">${meta.join('')}</text>
        ${kids ? `<circle class="knob" cx="${W}" cy="${H / 2}" r="10"/><text class="kt" x="${W}" y="${H / 2 + 4.5}" text-anchor="middle">${open ? '−' : '+'}</text>` : ''}
      </g>`;
    }).join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Call flow diagram">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
      ${edgeSvg}${nodeSvg}</svg>`;
  }

  function renderView() {
    const box = document.getElementById('view');
    const ep = EPS[current];
    if (view === 'tree') {
      box.className = '';
      box.innerHTML = '<ul class="tree" id="tree"></ul>';
      const flagged = new Set(FINDINGS[current].flatMap(f => f.nodes));
      const tree = box.firstElementChild;
      tree.appendChild(buildRow(ep.handler, null, [], 1, 0, flagged));
      setOpen(tree.firstElementChild, true);
      return;
    }
    box.className = 'canvas';
    box.innerHTML = renderDiagram(ep.handler);
    box.querySelectorAll('.node').forEach(g => {
      const act = () => {
        const id = g.dataset.id;
        selected = id;
        if (edges(id).length) expanded.has(id) ? expanded.delete(id) : expanded.add(id);
        renderView();
        renderDetail();
        document.querySelector(`#view .node[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
      };
      g.onclick = act;
      g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
    });
  }

  function renderMain() {
    const ep = EPS[current], fs = FINDINGS[current];
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="head"><span class="title mono"><span class="method">${esc(ep.method)}</span>${esc(ep.path)}</span>
        <span class="total">≈ ${TOTAL[current]} ms sequential (estimate)</span></div>
      <h2>Problems</h2>
      ${fs.length ? '<ul class="findings" id="findings"></ul>' : '<p class="none">No rule found a problem.</p>'}
      <h2>Call flow</h2>
      <div class="tools">
        <div class="tabs" role="tablist" aria-label="View">
          <button role="tab" data-view="diagram" aria-selected="${view === 'diagram'}">Diagram</button>
          <button role="tab" data-view="tree" aria-selected="${view === 'tree'}">Tree</button>
        </div>
        <button id="expand">Expand all</button><button id="collapse">Collapse</button>
      </div>
      <div id="view"></div>
      <div class="legend">
        <span class="k-handler mono">handler</span><span class="mono">service</span>
        <span class="k-repo mono">repository (DB)</span><span class="k-client mono">client</span>
        <span class="k-external mono">external system</span>
        <span>dashed edge: external call</span><span style="color:var(--warn)">red edge: loop</span>
        <span>Times are static estimates by node kind, not measurements</span>
      </div>`;
    const fl = document.getElementById('findings');
    fs.forEach(f => {
      const li = document.createElement('li');
      li.innerHTML = `<button><span class="rule">${esc(f.rule)}</span>${esc(f.text)}</button>`;
      li.firstElementChild.onclick = () => highlight(f.nodes);
      fl.appendChild(li);
    });
    main.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
      view = b.dataset.view;
      main.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-selected', x === b));
      renderView();
    });
    document.getElementById('expand').onclick = () => setAll(true);
    document.getElementById('collapse').onclick = () => setAll(false);
    renderView();
  }

  function renderDetail() {
    const d = document.getElementById('detail');
    if (!selected) { d.innerHTML = '<p class="empty">Click a method in the flow to see who calls it and which endpoints use it.</p>'; return; }
    const n = N[selected] || {};
    const eps = [...(usedIn[selected] || [])];
    const calls = edges(selected);
    const from = [...(callers[selected] || [])];
    d.innerHTML = `
      <h2 class="mono" style="margin-top:0;word-break:break-all">${esc(selected)}</h2>
      <dl>
        <dt>Type</dt><dd>${KIND[n.kind] || esc(n.kind ?? '–')}</dd>
        <dt>Source</dt><dd class="mono" style="word-break:break-all">${esc(n.source ?? '–')}</dd>
        <dt>Own time</dt><dd>≈ ${ownMs(selected)} ms</dd>
        <dt>Incl. calls</dt><dd>≈ ${cost(selected)} ms</dd>
        ${n.kind === 'client' ? `<dt>Timeout</dt><dd>${n.timeoutMs != null ? esc(n.timeoutMs) + ' ms' : '<span style="color:var(--warn)">missing</span>'}</dd><dt>Retry</dt><dd>${esc(n.retry ?? '–')}</dd>` : ''}
      </dl>
      <h3>Used in endpoints (${eps.length})</h3>
      <ul>${eps.map(i => `<li><button class="link mono" data-ep="${i}">${esc(EPS[i].method)} ${esc(EPS[i].path)}</button></li>`).join('')}</ul>
      <h3>Called from</h3>
      ${from.length ? `<ul>${from.map(c => `<li class="mono">${esc(c)}</li>`).join('')}</ul>` : '<p class="empty">Entry point of the endpoint.</p>'}
      <h3>Calls</h3>
      ${calls.length ? `<ul>${calls.map(e => `<li class="mono">${esc(e.to)}${e.loop ? ` (×${esc(e.loop)})` : ''}</li>`).join('')}</ul>` : '<p class="empty">Nothing else.</p>'}`;
    d.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => {
      current = +b.dataset.ep; resetView(); renderList(); renderMain(); highlight([selected]);
    });
  }

  renderMeta(); renderGaps(); renderList(); renderMain();
})();
</script>
</body>
</html>
