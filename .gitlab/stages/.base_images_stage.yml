build_dotnet_dev_base:
  stage: base_images
  image: docker:28.0.0
  allow_failure: true
  extends: .rules-base-image-manual
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "${CI_REGISTRY_PASSWORD:-$CI_JOB_TOKEN}" "$CI_REGISTRY"
    - docker build --pull -f Dockerfile.dotnet-dev-base -t "$CI_REGISTRY_IMAGE/dotnet-dev-base:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE/dotnet-dev-base:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/dotnet-dev-base:latest"
    - docker push "$CI_REGISTRY_IMAGE/dotnet-dev-base:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/dotnet-dev-base:latest"

build_dotnet_prod_base:
  stage: base_images
  image: docker:28.0.0
  allow_failure: true
  extends: .rules-base-image-manual
